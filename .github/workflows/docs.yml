name: API documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          # Matches minimum_zig_version in build.zig.zon.
          version: 0.16.0

      - name: Build paxos API docs
        run: zig build docs

      - name: Build zaxonlite API docs
        run: zig build docs
        working-directory: zaxonlite

      - name: Assemble site
        run: |
          mkdir -p site/paxos site/zaxonlite
          cp -R zig-out/docs/api/. site/paxos/
          cp -R zaxonlite/zig-out/docs/api/. site/zaxonlite/
          cat > site/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>paxos-zig API documentation</title>
          </head>
          <body>
            <h1>paxos-zig API documentation</h1>
            <ul>
              <li><a href="paxos/">paxos — bounded Multi-Paxos library</a></li>
              <li><a href="zaxonlite/">zaxonlite — embedded replicated SQLite</a></li>
            </ul>
          </body>
          </html>
          HTML

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
