# CI for the paxos-zig library.
#
# While this repository still hosts the monorepo, a second job also builds
# and tests the zaxonlite subpackage. When zaxonlite moves to its own
# repository (insanai/zaxonlite), delete the `zaxonlite` job here; the
# split repository carries its own workflow.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  paxos:
    name: paxos (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Format and style check
        run: zig build fmt

      - name: Unit tests and seeded fault simulation
        run: zig build test

      - name: Extended simulation sweep
        if: matrix.os == 'ubuntu-latest'
        run: zig build sim -- --seeds=512 --steps=1024

  zaxonlite:
    name: zaxonlite (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: zaxonlite
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      # macOS runners ship Homebrew openssl@3 at the build's default prefix.
      - name: Install OpenSSL 3 (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev

      - name: Compile every binary
        run: zig build check

      - name: Unit and single-process integration tests
        run: zig build test

      - name: C ABI smoke test
        run: zig build test-cabi

      - name: CLI contract test
        run: zig build test-cli
