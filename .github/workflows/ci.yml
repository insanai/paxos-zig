# CI for the paxos-zig library (insanai/paxos-zig).
#
# The library is zero-dependency and does no I/O, so the pipeline is the
# same three commands a contributor runs locally: style, tests with the
# seeded fault simulation, and a longer simulation sweep.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Format and style check
        run: zig build fmt

      - name: Unit tests and seeded fault simulation
        run: zig build test

      - name: Extended simulation sweep
        if: matrix.os == 'ubuntu-latest'
        run: zig build sim -- --seeds=512 --steps=1024
