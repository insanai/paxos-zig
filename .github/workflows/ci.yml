# CI for the paxos-zig library (insanai/paxos-zig).
#
# The library is zero-dependency and does no I/O, so the pipeline is the
# same three commands a contributor runs locally: style, tests with the
# seeded fault simulation, and a longer simulation sweep. The Linux job
# then checks out insanai/zaxonlite into zaxonlite/ (the layout its
# `.path = ".."` manifest expects) and runs its tests, so a library
# change that breaks the downstream consumer fails here, not there.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Format and style check
        run: zig build fmt

      - name: Unit tests and seeded fault simulation
        run: zig build test

      - name: Extended simulation sweep
        if: matrix.os == 'ubuntu-latest'
        run: zig build sim -- --seeds=512 --steps=1024

      # While insanai/zaxonlite is private, add a CROSS_REPO_TOKEN secret
      # (fine-grained PAT with read access to it); once public, the
      # default token fallback is enough.
      - name: Checkout zaxonlite (downstream consumer)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/checkout@v4
        with:
          repository: insanai/zaxonlite
          token: ${{ secrets.CROSS_REPO_TOKEN || github.token }}
          path: zaxonlite

      - name: Install OpenSSL 3 for zaxonlite
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev

      # Zig's zip fetch (the SQLite amalgamation) writes its temporary
      # file under the global cache's tmp/ directory but does not create
      # it.
      - name: Prepare Zig package cache
        if: matrix.os == 'ubuntu-latest'
        run: mkdir -p "${ZIG_GLOBAL_CACHE_DIR:-$HOME/.cache/zig}/tmp"

      - name: Zaxonlite unit and integration tests
        if: matrix.os == 'ubuntu-latest'
        run: zig build test-zaxonlite

      - name: Zaxonlite voter replacement scenario
        if: matrix.os == 'ubuntu-latest'
        working-directory: zaxonlite
        run: zig build test-replace-cluster
